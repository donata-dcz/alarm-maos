name: FermeReveil
options:
  bundleIdPrefix: com.exemple
  deploymentTarget:
    iOS: "26.0"

packages:
  AlarmCore:
    path: FermeReveil/FermeReveil

targets:
  FermeReveil:
    type: application
    platform: iOS
    sources:
      - path: FermeReveil/FermeReveilApp
    dependencies:
      - package: AlarmCore
        product: AlarmCore
    info:
      path: FermeReveil/FermeReveilApp/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exemple.fermereveil
